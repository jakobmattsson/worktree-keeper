name: CI and publish

on:
  push:
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Record tested contents
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node -e 'const fs = require("node:fs"); const tree = require("node:child_process").execFileSync("git", ["rev-parse", "HEAD^{tree}"], {encoding:"utf8"}).trim(); fs.writeFileSync("tested-tree.json", JSON.stringify({pullRequest:Number(process.env.PR_NUMBER), head:process.env.PR_HEAD, tree}));'
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ github.run_attempt }}
          path: tested-tree.json
          retention-days: 90

  package:
    if: ${{ github.event_name == 'pull_request' }}
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run --json

  publish:
    name: Publish to npm
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify tested release PR
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./.github/scripts/verify-release.cjs');
            await verify({ github, context });
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node bin/worktree-keeper.js verify-release-version
      - run: npm install --global npm@11.21.0
      - run: npm publish
