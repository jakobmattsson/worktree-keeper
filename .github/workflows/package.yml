name: CI and publish

on:
  push:
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify strict release checks
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: node bin/worktree-keeper.js verify-release-protection
      - run: npm test

  package:
    if: ${{ github.event_name == 'pull_request' }}
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run --json

  publish:
    name: Publish to npm
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node bin/worktree-keeper.js verify-release
      - run: npm install --global npm@11.21.0
      - run: npm publish
