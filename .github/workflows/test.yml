name: Test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v5
      - run: npm ci
      - name: Verify strict release checks
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: node bin/worktree-keeper.js verify-release-protection
      - run: npm test

  package:
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v5
      - run: npm ci
      - run: npm pack --dry-run --json
